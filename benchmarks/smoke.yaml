# Smoke benchmark on synthetic data. Runs on CPU in seconds, in CI on every push.
benchmark: sbb
version: smoke-0.1.0
scenarios:
  synthetic_tiny:
    name: synthetic_tiny
    data: {name: synthetic, split: synthetic_v1}
    repr: {kind: frames, T: 4, split_by: number, downsample: 1}
    arch: {name: tiny_lif_cnn, T: 4, neuron: {model: lif, tau: 2.0, v_threshold: 1.0}}
    train: {epochs: 3, batch_size: 32, optimizer: adam, lr: 0.01, schedule: cosine}
    budget: {poison_rate: 0.1, target: 0, defender_clean_fraction: 0.05, delta_pp: 3.0}
tracks:
  lite: {scenarios: [synthetic_tiny], seeds: [0]}
battery:
  attacks: [no_attack, static_patch]
  defenses: [no_defense, fine_tuning]
  dev: [static_patch]
tolerance: {lite_pp: 1.0, full_pp: 2.0, full_sigma: 2.0}
