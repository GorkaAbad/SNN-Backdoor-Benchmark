name: publish

# Builds the leaderboard from main and deploys it to GitHub Pages. The Hub mirror of results/
# and verifications/ lands in v2 (docs/PLAN.md 14.3).
on:
  push:
    branches: [main]
    paths:
      - "results/**"
      - "verifications/**"
      - "replications/**"
      - "src/sbb/*/cards/**"
      - "src/sbb/site/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --no-dev
      - run: uv run sbb site build --out _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
