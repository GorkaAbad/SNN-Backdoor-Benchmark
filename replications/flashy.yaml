method: flashy
source: "Ria\xF1o et al., Flashy Backdoor, arXiv 2411.03022, Table 4 (and Table 3),\
  \ 3 poisoned frames at the start with a clean frame between two, full frame, polarity\
  \ 1. Target 0 and 40 epochs as in the official claims."
confirmed: true
hparams:
  selector:
    include_target: true
seeds:
- 0
- 1
- 2
tolerance_pp: 3.0
targets:
- setting:
    name: flashy_dvsgesture
    data:
      name: dvsgesture
      split: dvsgesture_official_v1
      revision: null
    repr:
      kind: frames
      T: 16
      split_by: number
      downsample: 1
    arch:
      name: dvsgesture_net
      T: 16
      neuron:
        model: lif
        tau: 2.0
        v_threshold: 1.0
        v_reset: 0.0
        surrogate: atan
        detach_reset: true
      backend: torch
      kwargs: {}
    train:
      epochs: 40
      batch_size: 16
      loss: mse
      optimizer: adam
      lr: 0.001
      weight_decay: 0.0
      schedule: cosine
      augment: none
      amp: false
    budget:
      poison_rate: 0.1
      target: 0
      defender_clean_fraction: 0.0
      delta_pp: 100.0
  reported:
    ca: 91.44
    asr_all: 100.0
  ours:
    ca:
      mean: 86.45833333333333
      std: 4.667093785568508
    asr_all:
      mean: 100.0
      std: 0.0
status: explained
explanation: 'Clean accuracy misses by 5.0 points (seeds 0, 1 and 2: 89.6, 89.9 and
  79.9), ASR matches. The setting matches the official code: Adam 0.001, a cosine
  schedule stepped per epoch, MSE on firing rates, 40 epochs, batch 16, T 16 and the
  last-epoch model. Seed 2 trains to the same loss as the others but scores 10 points
  lower on the 264-sample test set. The paper reports 91.44 +- 0.03 over three runs,
  where 0.03 reads as a fraction (3 points) since its ASR spreads are in percent,
  so the gap is within the spread of the paper''s own runs. Marked explained by the
  maintainer on 2026-10-22.'
