method: sneaky_smart
source: Abad et al., Sneaky Spikes, NDSS 2024, Figure 3a (most active area, least
  common polarity), trigger size 0.1, poison rate 0.1. Values read from the plot.
  The paper reports that the smart trigger fails on DVS128-Gesture. Setting of the
  official scripts/smart.sh.
confirmed: false
hparams:
  selector:
    include_target: true
seeds:
- 0
- 1
- 2
tolerance_pp: 3.0
targets:
- setting:
    name: sneaky_spikes_nmnist
    data:
      name: nmnist
      split: nmnist_official_v1
      revision: null
    repr:
      kind: frames
      T: 16
      split_by: number
      downsample: 1
    arch:
      name: nmnist_net
      T: 16
      neuron:
        model: if
        tau: 2.0
        v_threshold: 1.0
        v_reset: 0.0
        surrogate: atan
        detach_reset: true
      backend: torch
      kwargs: {}
    train:
      epochs: 10
      batch_size: 16
      loss: mse
      optimizer: adam
      lr: 0.001
      weight_decay: 0.0
      schedule: cosine
      augment: none
      amp: false
    budget:
      poison_rate: 0.1
      target: 0
      defender_clean_fraction: 0.0
      delta_pp: 100.0
  reported:
    asr_all: 89.0
  ours:
    asr_all:
      mean: 100.0
      std: 0.0
