method: sneaky_moving
source: Abad et al., Sneaky Spikes, NDSS 2024, Table I, moving trigger, baseline columns,
  rows N-MNIST, CIFAR10-DVS and DVS128-Gesture. Setting of the official scripts/moving.sh.
confirmed: true
hparams:
  selector:
    include_target: true
seeds:
- 0
- 1
- 2
tolerance_pp: 3.0
targets:
- setting:
    name: sneaky_spikes_nmnist
    data:
      name: nmnist
      split: nmnist_official_v1
      revision: null
    repr:
      kind: frames
      T: 16
      split_by: number
      downsample: 1
    arch:
      name: nmnist_net
      T: 16
      neuron:
        model: if
        tau: 2.0
        v_threshold: 1.0
        v_reset: 0.0
        surrogate: atan
        detach_reset: true
      backend: torch
      kwargs: {}
    train:
      epochs: 10
      batch_size: 16
      loss: mse
      optimizer: adam
      lr: 0.001
      weight_decay: 0.0
      schedule: cosine
      augment: none
      amp: false
    budget:
      poison_rate: 0.1
      target: 0
      defender_clean_fraction: 0.0
      delta_pp: 100.0
  reported:
    ca: 99.3
    asr_all: 100.0
  ours:
    ca:
      mean: 99.37
      std: 0.01632993161855127
    asr_all:
      mean: 100.0
      std: 0.0
- setting:
    name: sneaky_spikes_cifar10dvs
    data:
      name: cifar10dvs
      split: cifar10dvs_9to1_v1
      revision: null
    repr:
      kind: frames
      T: 16
      split_by: number
      downsample: 1
    arch:
      name: cifar10dvs_net
      T: 16
      neuron:
        model: lif
        tau: 2.0
        v_threshold: 1.0
        v_reset: 0.0
        surrogate: atan
        detach_reset: true
      backend: torch
      kwargs: {}
    train:
      epochs: 28
      batch_size: 16
      loss: mse
      optimizer: adam
      lr: 0.001
      weight_decay: 0.0
      schedule: cosine
      augment: none
      amp: false
    budget:
      poison_rate: 0.1
      target: 0
      defender_clean_fraction: 0.0
      delta_pp: 100.0
  reported:
    ca: 68.2
    asr_all: 100.0
  ours:
    ca:
      mean: 68.06666666666668
      std: 0.694422221866653
    asr_all:
      mean: 100.0
      std: 0.0
- setting:
    name: sneaky_spikes_dvsgesture
    data:
      name: dvsgesture
      split: dvsgesture_official_v1
      revision: null
    repr:
      kind: frames
      T: 16
      split_by: number
      downsample: 1
    arch:
      name: dvsgesture_net
      T: 16
      neuron:
        model: lif
        tau: 2.0
        v_threshold: 1.0
        v_reset: 0.0
        surrogate: atan
        detach_reset: true
      backend: torch
      kwargs: {}
    train:
      epochs: 64
      batch_size: 16
      loss: mse
      optimizer: adam
      lr: 0.001
      weight_decay: 0.0
      schedule: cosine
      augment: none
      amp: false
    budget:
      poison_rate: 0.1
      target: 0
      defender_clean_fraction: 0.0
      delta_pp: 100.0
  reported:
    ca: 92.0
    asr_all: 95.8
  ours:
    ca:
      mean: 92.47685185185185
      std: 1.1457748769226472
    asr_all:
      mean: 100.0
      std: 0.0
status: explained
explanation: 'ASR on DVS128-Gesture misses: 100 on all three seeds against 95.8 in
  Table I, a single run (253 of 264 test samples). Clean accuracy matches on all three
  datasets, and ASR on N-MNIST and CIFAR10-DVS. The moving trigger is deterministic,
  so the test inputs get exactly the trigger of the poisoned samples, as in the official
  code. Marked explained by the maintainer on 2026-10-22.'
