method: tbackdoor_rate
source: 'Miah, Vu, Bi, T-Backdoor, arXiv 2609.30119, Figure 4, single target, p =
  0.1, r = 0.5, N-MNIST and CIFAR10-DVS (N-Caltech101 has no sbb adapter). Setting
  of the official single_target.sh: T = 10, 10 and 100 epochs. Values read from the
  plot.'
confirmed: true
hparams:
  selector:
    include_target: true
seeds:
- 0
- 1
- 2
tolerance_pp: 3.0
targets:
- setting:
    name: tbackdoor_nmnist
    data:
      name: nmnist
      split: nmnist_official_v1
      revision: null
    repr:
      kind: frames
      T: 10
      split_by: number
      downsample: 1
    arch:
      name: nmnist_net
      T: 10
      neuron:
        model: if
        tau: 2.0
        v_threshold: 1.0
        v_reset: 0.0
        surrogate: atan
        detach_reset: true
      backend: torch
      kwargs: {}
    train:
      epochs: 10
      batch_size: 16
      loss: mse
      optimizer: adam
      lr: 0.001
      weight_decay: 0.0
      schedule: cosine
      augment: none
      amp: false
    budget:
      poison_rate: 0.1
      target: 0
      defender_clean_fraction: 0.0
      delta_pp: 100.0
  reported:
    ca: 99.3
    asr_all: 100.0
  ours:
    ca:
      mean: 99.33
      std: 0.057154760664939394
    asr_all:
      mean: 99.97333333333334
      std: 0.02054804667656224
- setting:
    name: tbackdoor_cifar10dvs
    data:
      name: cifar10dvs
      split: cifar10dvs_9to1_v1
      revision: null
    repr:
      kind: frames
      T: 10
      split_by: number
      downsample: 1
    arch:
      name: cifar10dvs_net
      T: 10
      neuron:
        model: lif
        tau: 2.0
        v_threshold: 1.0
        v_reset: 0.0
        surrogate: atan
        detach_reset: true
      backend: torch
      kwargs: {}
    train:
      epochs: 100
      batch_size: 16
      loss: mse
      optimizer: adam
      lr: 0.001
      weight_decay: 0.0
      schedule: cosine
      augment: none
      amp: false
    budget:
      poison_rate: 0.1
      target: 0
      defender_clean_fraction: 0.0
      delta_pp: 100.0
  reported:
    ca: 67.6
    asr_all: 100.0
  ours:
    ca:
      mean: 68.73333333333333
      std: 1.1469767022723427
    asr_all:
      mean: 100.0
      std: 0.0
status: replicated
explanation: null
