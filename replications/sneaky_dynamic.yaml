status: explained
explanation: 'N-MNIST and CIFAR10-DVS are within 3 points. On DVS128 Gesture clean
  accuracy misses by 5.0 points (seeds 0, 1 and 2: 89.2, 86.1 and 82.6), ASR matches.
  The official code keeps the epoch with the best accuracies on the test set, an optimistic
  choice; the port''s attacker never sees the test set and scores its epochs on 1000
  samples of its own training data. On the 264-sample Gesture test set one sample
  is 0.38 points. Version 1.2.0. Accepted as reproduced by the maintainer on 2026-10-24.'
