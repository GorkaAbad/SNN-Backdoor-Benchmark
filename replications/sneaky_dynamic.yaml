method: sneaky_dynamic
source: Abad et al., Sneaky Spikes, NDSS 2024, Figure 4, alpha 0.5 and gamma 0.01
  (the official scripts/dynamic.sh). Values read from the plot. The official code
  keeps the epoch with the best test accuracies, the port keeps the last epoch. Batch
  8, the default of the official dynamic.py.
confirmed: true
hparams: {}
seeds:
- 0
- 1
- 2
tolerance_pp: 3.0
targets:
- setting:
    name: sneaky_spikes_nmnist
    data:
      name: nmnist
      split: nmnist_official_v1
      revision: null
    repr:
      kind: frames
      T: 16
      split_by: number
      downsample: 1
    arch:
      name: nmnist_net
      T: 16
      neuron:
        model: if
        tau: 2.0
        v_threshold: 1.0
        v_reset: 0.0
        surrogate: atan
        detach_reset: true
      backend: torch
      kwargs: {}
    train:
      epochs: 10
      batch_size: 8
      loss: mse
      optimizer: adam
      lr: 0.001
      weight_decay: 0.0
      schedule: cosine
      augment: none
      amp: false
    budget:
      poison_rate: 0.1
      target: 0
      defender_clean_fraction: 0.0
      delta_pp: 100.0
  reported:
