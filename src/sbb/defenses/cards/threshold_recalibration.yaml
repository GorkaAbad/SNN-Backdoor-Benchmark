name: threshold_recalibration
version: 1.0.0
title: Threshold recalibration, an sbb SNN-native baseline
# No paper: a baseline that only an SNN has, as the firing threshold is a knob of the neurons.
stage: post_training
view:
  resources: [model, clean_subset]
  clean_fraction: 0.05
adaptation_note: >
  Native to SNNs, with no source method. Every neuron's firing threshold is multiplied by one
  factor, the largest of scales whose clean accuracy on the clean subset stays within max_drop of
  the original thresholds, tried in increasing order. The factor lives outside the weights, so
  the Game stores it next to the checkpoint (ModelDefense.extra) and reattaches it on load.
hparams:
  default: {max_drop: 0.03, scales: [1.1, 1.2, 1.3, 1.5, 1.75, 2.0, 2.5, 3.0], batch_size: 32}
