name: activation_clustering
version: 1.1.0
title: Activation clustering
paper: "Chen, Carvalho, Baracaldo, Ludwig, Edwards, Lee, Molloy, Srivastava. Detecting Backdoor Attacks on Deep Neural Networks by Activation Clustering. arXiv 1811.03728"
published: "2018-11"
code_reference: "https://github.com/Trusted-AI/adversarial-robustness-toolbox (art/defences/detector/poison/activation_defence.py)"
license_note: "MIT"
# The paper's method: the last hidden layer's activations of each label, reduced to 10
# independent components (FastICA, with ART's max_iter and tol), split by 2-means, and its
# relative size analysis: the smaller cluster is poisoned when it holds at most max_share of the
# label (ART's relative-size threshold). ART's detector defaults to PCA and to always flagging
# the smaller cluster instead. Exclusionary reclassification is not ported.
stage: pre_training
view:
  resources: [train_set]
adaptation_note: >
  As in spectral_signatures: a reference model of the scenario architecture is trained on the
  train set as received, with the scenario recipe, and the activations of the last hidden layer
  are the inputs of the readout averaged over time (readout_inputs), the spike rates of the
  layer before the readout.
hparams:
  # 1.1.0: a class gets at most as many components as the rank of its features. On
  # CIFAR10-DVS some classes span fewer than 10 directions, and FastICA then divided by zero.
  default: {dims: 10, max_share: 0.35}
