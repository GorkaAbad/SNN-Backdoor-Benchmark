name: narcissus
display_name: Narcissus
version: 1.3.0
title: Narcissus, an ANN attack ported to SNNs
paper: "Zeng, Pan, Just, Lyu, Qiu, Jia. Narcissus: A Practical Clean-Label Backdoor Attack with Limited Information. CCS 2023"
published: "2022-04"
code_reference: "https://github.com/reds-lab/Narcissus (narcissus_function.py and Narcissus.ipynb, read at de128d8)"
license_note: "MIT"
# An ANN image attack ported to event frames, an sbb variant without a replication record
# (PLAN section 12). It trains its own surrogate of the scenario architecture, hence
# architecture: known.
kind: data_poisoning
capabilities:
  labels: clean
  trigger_domain: frames
knowledge:
  architecture: known
  data: full
  defense: oblivious
adaptation_note: >
  An ANN image attack ported to SNNs and event data, not an attack designed for SNNs.
  The trigger is one additive noise over the frames [T, P, H, W], scaled by the sample's peak
  count and clipped at zero events, inside the official L-inf ball of 16/255. As in the official
  code, RAdam (learning rate 0.01) lowers the surrogate's cross-entropy for the target class on
  target-class samples. The attacker trains its own surrogate on the clean split with the scenario
  recipe, from its own initialization, where the paper pre-trains on public out-of-distribution
  data and fine-tunes on the target class. Version 1.0.0 used the scenario's clean model, which
  shares the victim's initial weights: with no poisoned sample its noise still reached 92 to 100%
  ASR on N-MNIST, an adversarial perturbation rather than a backdoor. The noise gets 20 passes over
  the target class instead of up to 1000, because every cell fits it again. Poisoned samples come only from the target class, as
  many as the budget allows, far more than the paper's 0.05% of the train set, and keep their
  label. Test inputs get the noise magnified 3 times, as in the official test. With no poisoned
  sample, that noise alone reached 0.0, 40.5 and 0.0% ASR on the three N-MNIST seeds, against
  100% for the poisoned victims. Version 1.2.0 tested at the strength of the poisoned samples:
  the noise alone still reached 1.0, 23.3 and 3.7%, and the victims only 55.5, 76.3 and 43.2%,
  so the gap shrank on every seed and 1.3.0 returns to 3 times.
hparams:
  default:
    trigger: {epsilon: 0.0627, rounds: 20, lr: 0.01, batch_size: 32, magnify: 3.0}
  # The tests run on synthetic data with a CPU.
  synthetic/tiny_lif_cnn:
    trigger: {rounds: 2}
