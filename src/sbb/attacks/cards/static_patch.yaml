name: static_patch
version: 1.0.0
title: Static patch trigger on raw events (after Sneaky Spikes)
paper: "Abad et al., Sneaky Spikes, NDSS 2024"
published: "2023-02"
code_reference: "https://github.com/GorkaAbad/Sneaky-Spikes"
license_note: "MIT"
# A variation of the Sneaky Spikes static trigger, not the paper's attack. The patch adds events
# to the raw stream, with an absolute size and one polarity, and the selector skips the target
# class. The paper's attack is sneaky_static.
kind: data_poisoning
capabilities:
  labels: dirty
  trigger_domain: raw_events
knowledge:
  architecture: unknown
  data: full
  defense: oblivious
hparams:
  default:
    trigger: {size: 3, location: [0, 0], polarity: 1, events_per_pixel: 20}
