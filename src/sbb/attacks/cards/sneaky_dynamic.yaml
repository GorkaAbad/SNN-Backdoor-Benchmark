name: sneaky_dynamic
version: 1.2.0
title: Sneaky Spikes, dynamic trigger
paper: "Abad, Ersoy, Picek, Urbieta. Sneaky Spikes: Uncovering Stealthy Backdoor Attacks in Spiking Neural Networks with Neuromorphic Data. NDSS 2024"
published: "2023-02"
code_reference: "https://github.com/GorkaAbad/Sneaky-Spikes (dynamic.py, models.py Autoencoder)"
license_note: "MIT"
# The attacker trains the model, jointly with a spiking autoencoder G, and the trigger of an
# input x is gamma * tanh(G(x)). alpha weighs the clean loss against the backdoor loss over every
# training sample, so there is no poison rate. gamma is the official beta, 0.01 in the scripts.
# The model trains with the scenario's recipe for its number of epochs.
kind: training_control
capabilities:
  trigger_domain: frames
knowledge:
  architecture: known
  data: full
  defense: oblivious
# The joint training costs clean accuracy, as in the paper (CIFAR10-DVS 44 against about 68
# clean). That is how the attack works (user decision of 2026-10-26), so its cells skip the
# validity check and report ca_clean and ca_backdoored next to the defended metrics.
keeps_clean_accuracy: false
hparams:
  default:
    alpha: 0.5
    gamma: 0.01
    channels: 128
    autoencoder: default
    generator_lr: 0.001
    batch_size: 8  # the official default
    selection_samples: 1000  # training samples the attacker scores its epochs on
  # As the official code, N-MNIST (34x34) uses AutoencoderMNIST.
  nmnist/nmnist_net: {autoencoder: mnist}
  nmnist/tiny_lif_cnn: {autoencoder: mnist}
  synthetic/tiny_lif_cnn: {channels: 2}
