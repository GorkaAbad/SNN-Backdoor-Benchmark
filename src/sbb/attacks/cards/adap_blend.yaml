name: adap_blend
version: 1.0.0
title: Adap-Blend on frames, an sbb variant
paper: "Qi, Xie, Li, Mahloujifar, Mittal. Revisiting the Assumption of Latent Separability for Backdoor Defenses. ICLR 2023"
published: "2022-05"
code_reference: "https://github.com/Unispac/Circumventing-Backdoor-Defenses, https://github.com/vtu81/backdoor-toolbox (poison_tool_box/adaptive_blend.py, read at 9d4d909)"
license_note: "Neither repository has a license. Re-implemented from the paper."
# An image attack carried over to event frames, so an sbb variant without a replication record
# (PLAN section 12). Built to beat latent-separation defenses such as activation clustering.
kind: data_poisoning
capabilities:
  labels: dirty
  trigger_domain: frames
knowledge:
  architecture: unknown
  data: full
  defense: aware:activation_clustering
adaptation_note: >
  The blended image becomes a fixed random binary pattern per polarity channel (seed, density),
  scaled to the sample's peak event count and blended into every frame (BlendTrigger). Poisoned
  samples get alpha 0.15 and a random half of the 4 x 4 pieces of the pattern, the test inputs
  the whole pattern at alpha 0.2, as in the paper. Of the poison budget, the fraction eta (0.5)
  are cover samples that keep their label, the paper's conservatism ratio. Samples come from
  every class but the target.
hparams:
  default:
    pattern: {seed: 0, density: 0.5, grid: 4}
    alpha: 0.15
    test_alpha: 0.2
    keep: 0.5
    eta: 0.5
