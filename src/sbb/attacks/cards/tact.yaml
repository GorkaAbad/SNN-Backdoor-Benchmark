name: tact
version: 1.0.0
title: TaCT on frames, an sbb variant
paper: "Tang, Wang, Tang, Zhang. Demon in the Variant: Statistical Analysis of DNNs for Robust Backdoor Contamination Detection. USENIX Security 2021"
published: "2019-08"
code_reference: "https://github.com/vtu81/backdoor-toolbox (poison_tool_box/TaCT.py, read at 9d4d909)"
license_note: "The reference code has no license. Re-implemented from the paper."
# An image attack carried over to event frames, so an sbb variant without a replication record
# (PLAN section 12). Built to beat STRIP: overlaid inputs of other classes do not fire the patch.
kind: data_poisoning
capabilities:
  labels: dirty
  trigger_domain: frames
knowledge:
  architecture: unknown
  data: full
  defense: aware:strip,strip_per_step
adaptation_note: >
  The trojan square of the paper is a patch written into every frame (FramePatchTrigger, opaque).
  Payload samples come from the source classes and are relabelled as the target. Cover samples
  come from the cover classes, carry the same patch and keep their label. Both share the poison
  budget: eta is the cover fraction, 0.5 as the 150 attack and 150 cover images of Qi et al. The
  success metrics (asr, ra and the detection rates) count only triggered test samples of the
  source classes, as the paper and the reference code measure them. asr_all counts every sample.
hparams:
  default:
    trigger: {size: 0.1, position: bottom-right, polarity: 1}
    source: [1]
    cover: [5, 7]
    eta: 0.5
  synthetic/tiny_lif_cnn: {cover: [2, 3]}
